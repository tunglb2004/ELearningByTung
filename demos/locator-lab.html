<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form đăng nhập</title>
    <link rel="stylesheet" href="demo-base.css">
</head>
<body>
    <div class="demo-shell">
        <div class="demo-card">
            <h1>Form đăng nhập</h1>
            <p class="lead">Các trường dùng để luyện By.id, name, CSS, XPath trong slide.</p>
            <div class="demo-field">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" placeholder="Nhập username">
            </div>
            <div class="demo-field">
                <label for="pass">Mật khẩu</label>
                <input type="password" id="pass" name="pass" placeholder="Nhập password">
            </div>
            <button type="button" class="demo-btn" id="submit-btn">Đăng nhập</button>
        </div>
    </div>
</body>
</html>
